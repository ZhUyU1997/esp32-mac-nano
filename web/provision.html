<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>MacNano 连接 Wi-Fi</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect x='2.5' y='2.5' width='11' height='11' rx='1' fill='none' stroke='%23333' stroke-width='1.5'/%3E%3Crect x='4.5' y='9.5' width='7' height='4' fill='none' stroke='%23333' stroke-width='1'/%3E%3Crect x='5.5' y='3.5' width='5' height='3' fill='%23333'/%3E%3C/svg%3E">
<script>
  /* theme: share flash-theme preference; default follows system — set before paint */
  (function () {
    var saved = null;
    try { saved = localStorage.getItem('flash-theme'); } catch (e) {}
    var dark = saved === 'dark' || (saved === null && window.matchMedia('(prefers-color-scheme: dark)').matches);
    document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
    if (saved === null) {
      try {
        window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function (e) {
          if (!localStorage.getItem('flash-theme'))
            document.documentElement.setAttribute('data-theme', e.matches ? 'dark' : 'light');
        });
      } catch (err) {}
    }
  })();
</script>
</head>
<body>
<div id="app"></div>
<script type="module" src="/src/provision/index.jsx"></script>
</body>
</html>
