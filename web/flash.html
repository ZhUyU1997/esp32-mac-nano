<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mac Nano ESP32 · 固件工具</title>
  <style>
    :root {
      --bg: #e7ebf2;
      --ink: #2c3a52;
      --muted: #7c8aa0;
      --teal: #0ea5a4;
      --teal-dk: #0d9488;
      --indigo: #6366f1;
      --indigo-dk: #4338ca;
      --green: #059669;
      --red: #dc2626;
      --amber: #d97706;
      --shadow-dk: rgba(163, 177, 198, 0.55);
      --shadow-lt: rgba(255, 255, 255, 0.95);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body {
      font: 14px/1.6 -apple-system, "PingFang SC", "Hiragino Sans GB",
            "Microsoft YaHei", "Noto Sans SC", sans-serif;
      color: var(--ink);
      min-height: 100vh; padding: 40px 16px;
      display: flex; justify-content: center;
      background: var(--bg);
    }
    /* 技术元素保留等宽：地址 / 代码 / 日志 / 百分比 / 文件名 */
    code, .addr, .pct, #log, .pick-name, .step-num {
      font-family: ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas, monospace;
    }
    button, input { font: inherit; }

    /* ── 滚动条 ───────────────────────────────────────────────── */
    ::-webkit-scrollbar { width: 9px; height: 9px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb {
      background: var(--shadow-dk); border-radius: 5px;
      border: 2px solid var(--bg); background-clip: content-box;
    }
    ::-webkit-scrollbar-thumb:hover { background-color: var(--teal); }
    ::-webkit-scrollbar-corner { background: transparent; }

    /* ── Window ───────────────────────────────────────────────── */
    .window {
      width: 100%; max-width: 660px; align-self: flex-start;
      background: var(--bg);
      border-radius: 24px;
      box-shadow:
        14px 14px 30px var(--shadow-dk),
        -14px -14px 30px var(--shadow-lt);
      overflow: hidden;
      animation: windowIn 0.5s cubic-bezier(0.2, 0.9, 0.25, 1.05);
    }
    @keyframes windowIn { from { opacity: 0; transform: translateY(22px) scale(0.98); } }
    .titlebar {
      display: flex; align-items: center; gap: 10px;
      padding: 12px 18px;
      background: var(--bg);
      color: var(--teal-dk); font-size: 13px; font-weight: 700;
      letter-spacing: 0.05em;
      border-bottom: 1px solid rgba(163, 177, 198, 0.45);
    }
    .titlebar .dot {
      width: 9px; height: 9px; border-radius: 50%; flex: none;
      background: #f87171;
      box-shadow: 0 0 8px rgba(248, 113, 113, 0.9);
      animation: dotBlink 2.4s ease-in-out infinite;
      transition: background 0.3s, box-shadow 0.3s;
    }
    .titlebar .dot.busy { background: var(--amber); box-shadow: 0 0 8px rgba(217, 119, 6, 0.9); animation-duration: 0.9s; }
    .titlebar .dot.ok { background: var(--green); box-shadow: 0 0 8px rgba(5, 150, 105, 0.9); animation: none; }
    @keyframes dotBlink { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
    .titlebar .tag { margin-left: auto; font-size: 11px; color: var(--muted); }
    .window-body { padding: 18px 18px 16px; }
    .desc { margin: 0 0 13px; font-size: 13px; line-height: 1.6; color: var(--muted); }
    .desc b { color: var(--ink); }

    /* ── Steps（浮雕卡片）────────────────────────────────────── */
    .step {
      position: relative;
      background: var(--bg);
      border-radius: 16px;
      padding: 13px 14px 13px 20px; margin-bottom: 16px;
      box-shadow:
        6px 6px 14px var(--shadow-dk),
        -6px -6px 14px var(--shadow-lt);
      animation: stepIn 0.4s ease both;
      transition: box-shadow 0.25s;
    }
    .step:nth-child(1) { animation-delay: 0.08s; }
    .step:nth-child(2) { animation-delay: 0.16s; }
    .step:nth-child(3) { animation-delay: 0.24s; }
    @keyframes stepIn { from { opacity: 0; transform: translateY(14px); } }
    .step::before {   /* 左侧色条 */
      content: ""; position: absolute; left: 8px; top: 12px; bottom: 12px;
      width: 4px; border-radius: 3px; background: var(--shadow-dk);
      transition: background 0.3s;
    }
    .step.active {
      box-shadow:
        6px 6px 14px var(--shadow-dk),
        -6px -6px 14px var(--shadow-lt),
        0 0 0 1.5px rgba(99, 102, 241, 0.55),
        0 6px 22px rgba(99, 102, 241, 0.18);
    }
    .step.active::before { background: var(--indigo); }
    .step.done {
      box-shadow:
        6px 6px 14px var(--shadow-dk),
        -6px -6px 14px var(--shadow-lt),
        0 0 0 1.5px rgba(5, 150, 105, 0.5);
    }
    .step.done::before { background: var(--green); }
    .step h2 {
      font-size: 12px; text-transform: uppercase; letter-spacing: 0.12em;
      color: var(--muted); margin: 0 0 10px; font-weight: 700;
      transition: color 0.2s;
    }
    .step.active h2 { color: var(--indigo-dk); }
    .step.done h2 { color: var(--green); }
    .step-num {
      display: inline-block; width: 17px; height: 17px; line-height: 15px;
      text-align: center; border: 1px solid currentColor; border-radius: 50%;
      font-size: 11px; margin-right: 7px;
    }
    .step.done .step-num { border-color: var(--green); color: var(--green); }

    /* ── Controls ─────────────────────────────────────────────── */
    .row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 8px; }
    .row label { min-width: 118px; color: var(--muted); font-size: 13px; }
    .row .addr { min-width: 62px; color: var(--muted); font-size: 13px; }
    button {
      padding: 8px 16px; font-size: 13px;
      background: var(--bg);
      border: none; border-radius: 11px;
      color: var(--ink); cursor: pointer;
      box-shadow:
        4px 4px 10px var(--shadow-dk),
        -4px -4px 10px var(--shadow-lt);
      transition: all 0.15s ease;
    }
    button:hover:not(:disabled) {
      color: var(--teal-dk);
      box-shadow:
        5px 5px 12px var(--shadow-dk),
        -5px -5px 12px var(--shadow-lt),
        0 0 14px rgba(14, 165, 164, 0.16);
    }
    button:active:not(:disabled) {
      box-shadow:
        inset 3px 3px 7px var(--shadow-dk),
        inset -3px -3px 7px var(--shadow-lt);
      transform: translateY(1px);
    }
    button:disabled {
      cursor: not-allowed;
      color: rgba(44, 58, 82, 0.35);
      box-shadow:
        inset 2px 2px 6px var(--shadow-dk),
        inset -2px -2px 6px var(--shadow-lt);
    }
    button.primary {
      background: var(--bg);
      color: var(--teal-dk); font-weight: 700;
      box-shadow:
        4px 4px 10px rgba(14, 165, 164, 0.3),
        -4px -4px 10px var(--shadow-lt);
    }
    button.primary:hover:not(:disabled) {
      color: var(--teal-dk);
      box-shadow:
        5px 5px 12px rgba(14, 165, 164, 0.45),
        -5px -5px 12px var(--shadow-lt),
        0 0 0 1.5px rgba(14, 165, 164, 0.5);
    }
    button.primary:active:not(:disabled) {
      box-shadow:
        inset 3px 3px 8px rgba(14, 165, 164, 0.28),
        inset -3px -3px 8px var(--shadow-lt);
    }
    button.primary:disabled {
      color: rgba(13, 148, 136, 0.45);
      box-shadow:
        inset 2px 2px 6px var(--shadow-dk),
        inset -2px -2px 6px var(--shadow-lt);
    }
    input[type="text"] {
      padding: 6px 9px; border: none; border-radius: 9px;
      background: var(--bg); color: var(--ink); width: 160px;
      box-shadow:
        inset 3px 3px 7px var(--shadow-dk),
        inset -3px -3px 7px var(--shadow-lt);
    }
    .hint { color: var(--muted); font-size: 12px; margin-top: 6px; line-height: 1.5; }
    .hint code { background: rgba(44, 58, 82, 0.07); padding: 0 3px; border-radius: 3px; }
    .hint b { color: var(--ink); }

    /* ── Styled file picker ───────────────────────────────────── */
    .filepick { position: relative; display: inline-flex; align-items: center; gap: 8px; }
    .filepick .pick-btn {
      padding: 8px 16px; font-size: 13px; white-space: nowrap;
      background: var(--bg); color: var(--ink); border: none; border-radius: 11px;
      box-shadow:
        4px 4px 10px var(--shadow-dk),
        -4px -4px 10px var(--shadow-lt);
      transition: all 0.15s ease; cursor: pointer;
    }
    .filepick:hover .pick-btn {
      color: var(--teal-dk);
      box-shadow:
        5px 5px 12px var(--shadow-dk),
        -5px -5px 12px var(--shadow-lt),
        0 0 14px rgba(14, 165, 164, 0.16);
    }
    .filepick input[type="file"] {
      position: absolute; inset: 0; opacity: 0; cursor: pointer;
      width: 100%; height: 100%;
    }
    .pick-name {
      font-size: 12px; color: var(--muted);
      max-width: 200px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .pick-name.picked { color: var(--green); }

    /* ── Status / banner / device ─────────────────────────────── */
    .status { margin-left: auto; font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
    .status::before {
      content: ""; width: 8px; height: 8px; border-radius: 50%;
      background: var(--shadow-dk); transition: background 0.3s;
    }
    .status.busy::before { background: var(--amber); animation: dotBlink 0.9s ease-in-out infinite; }
    .status.ok { color: var(--green); }
    .status.ok::before { background: var(--green); box-shadow: 0 0 7px rgba(5, 150, 105, 0.7); }
    .status.err { color: var(--red); }
    .status.err::before { background: var(--red); box-shadow: 0 0 7px rgba(220, 38, 38, 0.7); }
    #banner {
      display: none;
      position: relative;
      color: #b91c1c;
      background: var(--bg);
      padding: 9px 12px 9px 18px;
      border-radius: 12px;
      margin-bottom: 13px; font-size: 13px;
      box-shadow:
        inset 3px 3px 8px rgba(220, 38, 38, 0.16),
        inset -3px -3px 8px var(--shadow-lt),
        0 0 0 1.5px rgba(220, 38, 38, 0.45);
      animation: stepIn 0.3s ease;
    }
    #banner::before {   /* 左侧红条（同步骤卡色条语言） */
      content: ""; position: absolute; left: 8px; top: 10px; bottom: 10px;
      width: 4px; border-radius: 3px; background: var(--red);
    }
    #banner.show { display: block; }
    .dev-info {
      margin-top: 8px; padding: 9px 12px;
      background: var(--bg); border-radius: 11px;
      font-size: 13px; line-height: 1.7;
      box-shadow:
        inset 3px 3px 8px var(--shadow-dk),
        inset -3px -3px 8px var(--shadow-lt);
      animation: stepIn 0.35s ease;
    }
    .dev-info b { color: var(--teal-dk); }

    /* ── Progress（凹陷轨道）─────────────────────────────────── */
    #bar {
      height: 14px; border-radius: 7px; overflow: hidden; margin: 10px 0 6px;
      background: var(--bg);
      box-shadow:
        inset 3px 3px 8px var(--shadow-dk),
        inset -3px -3px 8px var(--shadow-lt);
    }
    #bar > div {
      height: 100%; width: 0; border-radius: 7px;
      background: var(--teal);
      box-shadow: 0 0 10px rgba(14, 165, 164, 0.4);
      transition: width 0.15s ease;
    }
    #bar.error { box-shadow: inset 3px 3px 8px var(--shadow-dk), inset -3px -3px 8px var(--shadow-lt), 0 0 0 1.5px rgba(220, 38, 38, 0.5); }
    #bar.error > div { background: var(--red); box-shadow: 0 0 10px rgba(220, 38, 38, 0.5); }
    #progress-label { font-size: 12px; color: var(--muted); min-height: 18px; }
    #progress-label.error { color: var(--red); }
    #progress-label .pct { color: var(--teal-dk); font-weight: 700; }

    /* ── Log ──────────────────────────────────────────────────── */
    details#log-box { margin-top: 6px; border-radius: 14px; overflow: hidden;
      box-shadow:
        inset 3px 3px 8px var(--shadow-dk),
        inset -3px -3px 8px var(--shadow-lt); }
    details#log-box summary {
      padding: 8px 12px; cursor: pointer; font-size: 12px;
      text-transform: uppercase; letter-spacing: 0.12em; color: var(--muted);
      user-select: none;
    }
    details#log-box summary:hover { color: var(--ink); }
    #log {
      background: rgba(44, 58, 82, 0.04);
      color: var(--ink); border-top: 1px solid rgba(44, 58, 82, 0.06);
      padding: 10px 12px;
      height: 180px; overflow-y: auto; font-size: 12px; white-space: pre-wrap;
    }
    #log .err { color: var(--red); }
    #log .ok { color: var(--green); }

    /* ── DIY / advanced ───────────────────────────────────────── */
    details.advanced { margin-top: 10px; }
    details.advanced summary { cursor: pointer; font-size: 12px; color: var(--muted); user-select: none; transition: color 0.2s; }
    details.advanced summary:hover { color: var(--ink); }
    details.advanced[open] summary { color: var(--teal-dk); }
    .diy-del { padding: 3px 9px; }
  </style>
</head>
<body>
  <div class="window">
    <div class="titlebar">
      <span class="dot"></span> Mac Nano ESP32
      <span class="tag">固件升级 / 恢复 · 仅 Chrome/Edge</span>
    </div>
    <div class="window-body">
      <p class="desc">通过 <b>USB 数据线</b>升级固件或恢复设备，一键烧写。</p>
      <div id="app"></div>
    </div>
  </div>

  <script type="module" src="/src/flash.jsx"></script>
</body>
</html>
